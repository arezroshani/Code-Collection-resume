<!DOCTYPE html>
<html lang="fa">
  <head>

    


    
    <meta charset="UTF-8" />
    <title>ورود به پنل کاربری</title>
    <link rel="icon" href="./img/user-profile_5675043.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@30.1.0/dist/font-face.css" />
   
  <script defer src="bundle.js"></script><link href="bundle.css" rel="stylesheet"></head>

  <body dir="rtl">
    <div class="wrapper">
      <div class="login-box">
        <form>
          <h2 class="form-title font-family Vazirmatn">ورود</h2>

          <!-- ایمیل -->
          <div class="input-box">
            <span class="icon"><ion-icon name="mail"></ion-icon></span>
            <input type="email" required dir="rtl" />
            <label>ایمیل</label>
          </div>

          <!-- رمز عبور -->
          <div class="input-box">
            <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
            <input type="password" required />
            <label>رمز عبور</label>
          </div>

          <div class="remember-forgot">
            <label><input type="checkbox" /> مرا به خاطر بسپار</label>
            <a href="#">رمز خود را فراموش کرده‌اید؟</a>
          </div>
          

          <!-- دکمه ورود -->
          <button type="submit" class="submit-btn">ورود</button>

          

          <div class="register-link">
            <p>حساب کاربری ندارید؟ <a href="signup.html">ثبت‌ نام کنید</a></p>
          </div>
          
        </form>
      </div>
    </div>

    <!-- آیکون‌ها -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  </body>
</html>
