<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <title>ثبت نام کاربر</title>

    <link rel="icon" href="./img/user-profile_5675043.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://unicons.iconscout.com/release/v4.0.8/css/line.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@30.1.0/dist/font-face.css"
    />
    
    

  <script defer src="bundle.js"></script><link href="bundle.css" rel="stylesheet"></head>
  <body dir="rtl">
    <div class="wrapper">
      <div class="login-box">
        <form action="">
          <h2>ثبت نام</h2>

          <div class="input-box">
            <span class="icon"><i class="uil uil-user"></i></span>
            <input type="text" id="fullname" required />
            <label for="fullname">نام کامل</label>
          </div>

          <div class="input-box">
            <span class="icon"><i class="uil uil-envelope"></i></span>
            <input type="email" id="email" required />
            <label for="email">ایمیل</label>
          </div>

          <div class="input-box">
            <span class="icon"><i class="uil uil-lock"></i></span>
            <input type="password" id="password" required />
            <label for="password">رمز عبور</label>
          </div>

          <div class="input-box">
            <span class="icon"><i class="uil uil-lock-access"></i></span>
            <input type="password" id="confirm-password" required />
            <label for="confirm-password">تأیید رمز عبور</label>
          </div>

          <label class="terms">
            <input type="checkbox" required />
             <a href="#">با شرایط و قوانین موافقم</a> 
          </label>

          <button type="submit" class="submit-btn">ثبت نام</button>

          <div class="switch-link">
            <p>
              حساب کاربری دارید؟
              <a href="login.html">وارد شوید</a>
            </p>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    
  </body>
</html>
