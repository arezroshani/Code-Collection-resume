<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>پرداخت شارژ با کارت بانکی</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:;base64,=">
  

  
<script defer src="bundle.js"></script><link href="bundle.css" rel="stylesheet"></head>
<body class="payment-page ">
  <div class="payment-container">
    <div class="card-wrapper">
      <div class="credit-card" id="creditCard">
        <div class="front">
          <div class="chip"></div>
          <div class="card-number" id="cardNumberPreview">**** **** **** ****</div>
          <div class="card-holder" id="cardHolderPreview">نام دارنده: ---</div>
          <div class="exp-date" id="expDatePreview">انقضا: --/--</div>
        </div>
        <div class="back">
          <div class="magnetic-strip"></div>
          <div class="barcode"></div>
          <div class="cvv-label">کد CVV2:</div>
          <div class="cvv-preview" id="cvvPreview">****</div>
        </div>
      </div>
    </div>
    <form class="payment-form" onsubmit="event.preventDefault()">
      <h2>پرداخت اینترنتی</h2>
      <div class="form-group">
        <label for="cardNumber">شماره کارت</label>
        <input type="text" id="cardNumber" maxlength="19" placeholder="**** **** **** ****">
      </div>
      <div class="form-group">
        <label for="cardHolder">نام دارنده کارت</label>
        <input type="text" id="cardHolder" placeholder="نام و نام خانوادگی">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="expDate">تاریخ انقضا</label>
          <input type="text" id="expDate" maxlength="5" placeholder="MM/YY">
        </div>
        <div class="form-group">
          <label for="cvv">CVV2</label>
          <input type="text" id="cvv" maxlength="4" placeholder="****">
        </div>
      </div>
      <div class="form-group">
        <label for="password">رمز دوم (رمز پویا)</label>
        <input type="password" id="password" maxlength="6" placeholder="******">
      </div>
      <button type="submit" class="btn-submit">پرداخت</button>
    </form>
  </div>


 </body>
</html>
